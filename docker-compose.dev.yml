services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: potok
      POSTGRES_USER: potok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["vault_postgres_dev_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potok -d potok"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  vault_postgres_dev_data:
